<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #fafafa;
            color: #2c2c2c;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s ease;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        .loading-text {
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Balance Section */
        .balance-section {
            margin-bottom: 24px;
        }

        .balance-toggle {
            width: 100%;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #2c2c2c;
            transition: all 0.2s;
        }

        .balance-toggle:active {
            background: #f9f9f9;
        }

        .toggle-icon {
            font-size: 12px;
            color: #999;
            transition: transform 0.3s;
        }

        .balance-toggle.open .toggle-icon {
            transform: rotate(180deg);
        }

        .balance-row {
            background: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
        }

        .balance-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .balance-item:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
            font-weight: 600;
            font-size: 14px;
        }

        .balance-name {
            color: #2c2c2c;
            font-weight: 500;
        }

        .balance-value-text {
            color: #666;
        }

        .balance-value-text.positive {
            color: #e74c3c;
        }

        .balance-value-text.negative {
            color: #27ae60;
        }

        /* Month Navigation */
        .month-nav {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-title {
            font-size: 14px;
            font-weight: 600;
        }

        .nav-button {
            background: none;
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #2c2c2c;
            transition: background 0.2s;
        }

        .nav-button:active {
            background: #f0f0f0;
        }

        /* Calendar Section */
        .calendar-container {
            margin-bottom: 32px;
        }

        .calendar-month {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .calendar-month.current {
            border: 2px solid #3498db;
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.1);
        }

        .month-header {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .calendar-month.current .month-header {
            color: #3498db;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 8px;
        }

        .weekday-header {
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #999;
            padding: 4px 2px;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }


        #daysGrid .day-cell:nth-child(7n+6), 
        #daysGrid .day-cell:nth-child(7n+7) {
            background: #ffd3d4;
        }

        @media (max-width: 480px) {
            #daysGrid .day-cell:nth-child(7n+6), 
            #daysGrid .day-cell:nth-child(7n+7),
            .weekday-header:nth-child(7n+6),
            .weekday-header:nth-child(7n+7), 
            {
                visibility: hidden;
            }
        }

        .day-cell {
            background: #f8f8f8;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 4px 2px;
            aspect-ratio: 0.85;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            min-height: 52px;
        }

        .day-cell:active {
            transform: scale(0.98);
            background: #f0f0f0;
        }

        .day-cell.today {
            background: #fffbf0;
            border: 1.5px solid #f39c12;
        }

        .day-number {
            font-size: 10px;
            font-weight: 600;
            color: #999;
            margin-bottom: 2px;
        }

        .day-cell.today .day-number {
            color: #f39c12;
        }

        .person-assigned {
            font-size: 10px;
            font-weight: 600;
            color: #2c2c2c;
            word-break: break-word;
            line-height: 1.1;
        }

        .day-cell.empty {
            background: #fafafa;
            border-color: #f0f0f0;
            cursor: default;
        }

        .day-cell.empty:active {
            transform: none;
            background: #fafafa;
        }

        .day-cell.holiday {
            background: #ffebee;
            border-color: #ffcdd2;
        }

        .day-cell.holiday .day-number {
            color: #c62828;
        }

        /* Colors for persons */
        .robert { color: #e74c3c; }
        .bernat { color: #3498db; }
        .aritz { color: #27ae60; }
        .arnau { color: #f39c12; }

        /* Modal / Overlay */
        .modal {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px 12px 0 0;
            padding: 20px;
            box-shadow: 0 -2px 16px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .modal.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c2c2c;
        }

        .modal-options {
            display: grid;
            gap: 10px;
        }

        .modal-option {
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }

        .modal-option:active {
            background: #f0f0f0;
        }

        .modal-close {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2c;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
        }

        .modal-overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Capa de Carga / Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Carregant...</div>
    </div>

    <header>
        <h1>Papify</h1>
        <p class="subtitle">La Mirada => Guinardera</p>
    </header>

    <!-- Balance Section (Collapsible) -->
    <div class="balance-section">
        <button class="balance-toggle" id="balanceToggle">
            <span>Balanç</span>
            <span class="toggle-icon">▼</span>
        </button>
        <div class="balance-row" id="balanceContent" style="display: none;">
            <div class="balance-item">
                <span class="balance-name">Robert</span>
                <span class="balance-value-text">0</span>
            </div>
            <div class="balance-item">
                <span class="balance-name">Bernat</span>
                <span class="balance-value-text positive">+1 deu</span>
            </div>
            <div class="balance-item">
                <span class="balance-name">Aritz</span>
                <span class="balance-value-text negative">-1 li deuen</span>
            </div>
            <div class="balance-item">
                <span class="balance-name">Arnau</span>
                <span class="balance-value-text">0</span>
            </div>
            <div class="balance-item">
                <span class="balance-name">Total torns</span>
                <span class="balance-value-text">6</span>
            </div>
        </div>
    </div>

    <!-- Month Navigation -->
    <div class="month-nav">
        <button class="nav-button" id="prevBtn"> ← </button>
        <div class="month-title" id="monthTitle">Carregant...</div>
        <button class="nav-button" id="nextBtn"> → </button>
    </div>

    <!-- Calendar -->
    <div class="calendar-container">
        <div class="calendar-month current" id="currentCalendar">
            <div class="month-header" id="monthHeader">---</div>
            <div class="weekdays">
                <div class="weekday-header">L</div>
                <div class="weekday-header">M</div>
                <div class="weekday-header">X</div>
                <div class="weekday-header">J</div>
                <div class="weekday-header">V</div>
                <div class="weekday-header">S</div>
                <div class="weekday-header">D</div>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Modal for changing person -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="changePerson">
        <div class="modal-header">Canviar torn per <span id="selectedDate">--</span></div>
        <div class="modal-options">
            <button class="modal-option" data-person="Robert">Robert</button>
            <button class="modal-option" data-person="Bernat">Bernat</button>
            <button class="modal-option" data-person="Aritz">Aritz</button>
            <button class="modal-option" data-person="Arnau">Arnau</button>
            <button class="modal-option" data-person="—">Sense assignar</button>
        </div>
        <button class="modal-close" id="closeModal">Tancar</button>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuymUHyQIO7qQEH1vhN_0MdWy7JgsPI2sZkgku3POBLL1zptH1XyorWNwZi8JYuf2hig/exec';

        let schedule = {};
        let holidays = [];
        let currentDate = new Date();
        const monthNames = ['Gener', 'Febrer', 'Març', 'Abril', 'Maig', 'Juny', 
                           'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];
        const today = new Date();

        // Controladores del Loading Overlay
        function showLoading(text = 'Carregant...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // ===== CARGAR DATOS DE SHEETS =====
        async function loadDataFromSheets() {
            showLoading('Carregant...');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                schedule = {};
                if (data.calendar) {
                    data.calendar.forEach(row => {
                        if (row.fecha) {
                            schedule[row.fecha] = row.persona;
                        }
                    });
                }

                holidays = [];
                if (data.vacations) {
                    data.vacations.forEach(row => {
                        if (row.fecha) {
                            holidays.push(row.fecha);
                        }
                    });
                }

                updateCalendarDisplay();
            } catch (err) {
                console.error('Error carregant dades de Sheets:', err);
                alert('Error al carregar les dades des del Google Sheets.');
            } finally {
                hideLoading();
            }
        }

        // ===== GUARDAR CAMBIOS =====
        async function saveChangeToSheets(dateKey, persona) {
            showLoading('Guardant...');
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        fecha: dateKey,
                        persona: persona
                    })
                });

                const result = await response.json();
                if (result.success) {
                    schedule[dateKey] = persona;
                    updateCalendarDisplay();
                } else {
                    alert('Error al guardar el canvi al Google Sheets.');
                }
            } catch (err) {
                console.error('Error guardant en Google Sheets:', err);
                alert('Error al guardar. Intenta de nou');
            } finally {
                hideLoading();
            }
        }

        function generateDays(year, month) {
            const firstDay = new Date(year, month, 1);
            let startDate = new Date(firstDay);
            
            let dayOfWeek = startDate.getDay();
            let daysToSubtract = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            startDate.setDate(startDate.getDate() - daysToSubtract);

            const days = [];
            let currentDay = new Date(startDate);
            
            const lastDay = new Date(year, month + 1, 0);
            const endDate = new Date(lastDay);
            let endDayOfWeek = endDate.getDay();
            let daysToAdd = endDayOfWeek === 0 ? 0 : 7 - endDayOfWeek;
            endDate.setDate(endDate.getDate() + daysToAdd);

            while (currentDay <= endDate) {
                days.push({
                    date: new Date(currentDay),
                    dateKey: formatDateKey(currentDay),
                    dayNumber: currentDay.getDate(),
                    isCurrentMonth: currentDay.getMonth() === month,
                    isToday: formatDateKey(currentDay) === formatDateKey(today)
                });
                currentDay.setDate(currentDay.getDate() + 1);
            }
            return days;
        }

        function updateCalendarDisplay() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').textContent = monthNames[month] + ' ' + year;
            document.getElementById('monthHeader').textContent = monthNames[month] + ' ' + year;

            const days = generateDays(year, month);
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            days.forEach((dayObj) => {
                const isHoliday = holidays.includes(dayObj.dateKey);
                const person = schedule[dayObj.dateKey] || '';

                let cell = document.createElement('div');
                
                if (!dayObj.isCurrentMonth) {
                    cell.className = 'day-cell empty';
                } else {
                    cell.className = 'day-cell';
                    if (dayObj.isToday) cell.classList.add('today');
                    if (isHoliday) cell.classList.add('holiday');

                    const dayNumber = document.createElement('div');
                    dayNumber.className = 'day-number';
                    dayNumber.textContent = dayObj.dayNumber;
                    cell.appendChild(dayNumber);

                    if (person) {
                        const personDiv = document.createElement('div');
                        personDiv.className = 'person-assigned ' + person.toLowerCase();
                        personDiv.textContent = person;
                        cell.appendChild(personDiv);
                    }

                    cell.addEventListener('click', function() {
                        openModal(dayObj.dateKey, dayObj.dayNumber, monthNames[month]);
                    });
                }

                daysGrid.appendChild(cell);
            });
        }

        // Navegación
        document.getElementById('prevBtn').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateCalendarDisplay();
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateCalendarDisplay();
        });

        // Toggle del Balance
        document.getElementById('balanceToggle').addEventListener('click', function() {
            this.classList.toggle('open');
            document.getElementById('balanceContent').style.display = 
                this.classList.contains('open') ? 'flex' : 'none';
        });

        // Modal de Asignación
        const modal = document.getElementById('changePerson');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeModal');
        const selectedDateSpan = document.getElementById('selectedDate');
        let selectedDateKey = null;

        function openModal(dateKey, dayNumber, monthName) {
            selectedDateKey = dateKey;
            selectedDateSpan.textContent = dayNumber + ' de ' + monthName;
            modal.classList.add('active');
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            modalOverlay.classList.remove('active');
        }

        closeBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', closeModal);

        document.querySelectorAll('.modal-option').forEach(option => {
            option.addEventListener('click', function() {
                const newPerson = this.dataset.person === '—' ? '' : this.dataset.person;
                if (selectedDateKey) {
                    saveChangeToSheets(selectedDateKey, newPerson);
                }
                closeModal();
            });
        });

        // Inicializar
        loadDataFromSheets();
    </script>
</body>
</html>
